defaults:
  - high_jump
  - _self_

dataset:
  folder: ${base}/resources/dataset/adam_sp_data/high_jump/output
  joint_mapping: ${base}/resources/dataset/adam_sp_data/joint_id.txt
  # 与 retarget 脚本中 G1_LINK_BODY_NAMES/ADAM_LINK_BODY_NAMES 一致（pelvis → 腿 → 躯干 → 臂）
  body_order:
    - keyframe_pelvis_link
    - keyframe_left_hip_link
    - keyframe_left_knee_link
    - keyframe_left_ankle_link
    - keyframe_right_hip_link
    - keyframe_right_knee_link
    - keyframe_right_ankle_link
    - keyframe_head_link
    - keyframe_torso_link
    - keyframe_left_collar_link
    - keyframe_left_shoulder_link
    - keyframe_left_elbow_link
    - keyframe_left_wrist_link
    - keyframe_right_collar_link
    - keyframe_right_shoulder_link
    - keyframe_right_elbow_link
    - keyframe_right_wrist_link

asset:
  # Increase lower-limb tracking priority so policy is less likely to use knee valgus as a shortcut.
  keyframe_weights:
    hip: 1.5
    knee: 2.5
    ankle: 2.5

rewards:
  scales:
    # Stronger tracking terms for lower body / joint pose.
    sparse_tracking_body_position: 15
    sparse_tracking_body_position_feet: 20
    dense_tracking_dof_pos: 1.5
    dense_tracking_body_position_local: 1.0
    # Penalize near-limit postures harder to suppress abnormal leg configurations.
    dense_dof_pos_limits: -20.0

  # Tighten soft position limit to discourage aggressive side deviation.
  soft_dof_pos_limit: 0.95

  reward_tracking_sigma:
    # Smaller sigma => stronger penalty on tracking error.
    dof_pos_sigma: 0.35
    teleop_lower_body_pos: 0.06
    teleop_feet_pos: 0.02
