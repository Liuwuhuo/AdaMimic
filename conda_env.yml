# 仅用 conda 安装 python 和 pip，其余一律用 pip 安装，避免 conda 去 channel 找 wandb 等
name: adamimic
channels:
  - defaults
dependencies:
  - python=3.8
  - pip
  - pip:
    - numpy==1.20.3
    - tensorboard
    - tqdm
    - seaborn
    - GitPython
    - pydelatin
    - pyfqmr
    - hydra-core
    - wandb
    - git+https://github.com/KellerJordan/Muon